<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body class="dark">
  <header>
    <h1>My Library</h1>
  </header>

  <main>
    <button id="open-dialog-button">Add new book</button>
    <div id="display"></div>


    <dialog>
      <div class="dialog-header">
        <h2>Add a book</h2>
        <img src="icons/close-black.svg" alt="close button" id="close-dialog-button" class="close-button" />
      </div>

      <form id="add-book-form" method="dialog">
        <div class="form-inputs">
          <label for="title">Title*</label>
          <input autofocus type="text" name="title" id="title" />
          <label for="author">Author*</label>
          <input required type="text" name="author" id="author" />
          <label for="pages">Pages</label>
          <input min="1" step="1" type="number" name="pages" id="pages" />
        </div>

        <div class="form-checkbox">
          <label for="status">Have you read this book?</label>
          <input type="checkbox" name="status" id="status" />
        </div>

        <div class="form-button-container">
          <button type="reset">Reset</button>
          <button type="submit" value="add-book">Add Book</button>
        </div>
      </form>
    </dialog>
  </main>

  <footer>
    <small>made by c8in4</small>
  </footer>

  <div class="theme-button" onclick="toggleTheme()">Switch Theme</div>
  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark')
    }
  </script>
</body>

</html>
